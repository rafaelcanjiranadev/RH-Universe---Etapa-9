<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RH Universe | Funcionários</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="topo">
      <div class="marca">RH <span>UNIVERSE</span></div>
      <div class="subtitulo">Gestão de Recursos Humanos</div>
    </header>

    <section class="painel">
      <h1>CADASTRO DE FUNCIONÁRIO</h1>
      <div id="mensagem" class="mensagem" role="status" aria-live="polite"></div>
      <form id="formFuncionario" novalidate>
        <input type="hidden" id="id">
        <div class="form-grid">
          <label class="campo nome">Nome Completo:
            <input id="nome" name="nome" type="text" maxlength="120" autocomplete="name" required>
          </label>
          <label class="campo nascimento">Data de Nascimento:
            <input id="dataNascimento" name="dataNascimento" type="date" required>
          </label>
          <label class="campo cpf">CPF:
            <input id="cpf" name="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
          </label>
          <label class="campo salario">Salário Base (R$):
            <input id="salarioBase" name="salarioBase" type="number" min="0" max="9999999999.99" step="0.01" placeholder="0,00" required>
          </label>
          <label class="campo cargo">Cargo:
            <input id="cargo" name="cargo" type="text" maxlength="80" required>
          </label>
          <label class="campo status">Status:
            <select id="status" name="status" required>
              <option value="">Selecione</option>
              <option value="ATIVO">Ativo</option>
              <option value="INATIVO">Inativo</option>
            </select>
          </label>
        </div>
        <div class="acoes">
          <button class="btn cadastrar" type="submit" id="btnCadastrar">Cadastrar</button>
          <button class="btn limpar" type="button" id="btnLimpar">Limpar</button>
          <button class="btn editar" type="button" id="btnEditar" disabled>Editar selecionado</button>
          <button class="btn excluir" type="button" id="btnExcluir" disabled>Excluir</button>
          <button class="btn folha" type="button" disabled title="Disponível em uma atualização futura">Folha</button>
        </div>
      </form>

      <div class="busca">
        <label for="pesquisa">Pesquisar funcionário</label>
        <input id="pesquisa" type="search" placeholder="Digite nome, CPF ou cargo...">
      </div>

      <div class="tabela-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nome Completo</th><th>CPF</th><th>Data de Nascimento</th><th>Cargo</th><th>Salário Base</th><th>Status</th></tr></thead>
          <tbody id="listaFuncionarios"><tr><td colspan="7" class="vazio">Carregando funcionários...</td></tr></tbody>
        </table>
      </div>
      <p class="ajuda">Clique em uma linha para selecionar um funcionário e editar ou excluir.</p>
    </section>
    <footer>RH Universe · Cadastro de funcionários</footer>
  </main>
</body>
</html>
